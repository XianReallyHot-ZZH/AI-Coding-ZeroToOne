spring:
  application:
    name: simple-agent

  ai:
    openai:
      # API Key (支持 OpenAI 或 DeepSeek)
#      api-key: ${AI_API_KEY:${OPENAI_API_KEY:}}
      api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
      # Base URL: OpenAI 或 DeepSeek 兼容端点
#      base-url: ${AI_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
      base-url: ${AI_BASE_URL:${OPENAI_BASE_URL:https://api.deepseek.com}}
      chat:
        options:
          # 模型名称: gpt-4o, deepseek-chat, deepseek-reasoner 等
          model: ${AI_MODEL:deepseek-reasoner}
          temperature: 0.7

    # MCP Client 配置
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}

# Agent 配置
agent:
  default-model: ${AI_MODEL:deepseek-reasoner}
  system-prompt: |
    You are a helpful AI assistant with access to tools for:
    - Executing shell commands
    - Reading and writing files
    - Making HTTP requests
    - Additional tools provided via MCP

    Use these tools to help the user accomplish their tasks.
  max-steps: 200
  temperature: 0.7
  max-tokens: 4096

# 日志配置
logging:
  level:
    root: INFO
    com.example.agent: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  port: ${SERVER_PORT:8080}
