version: '3.8'

services:
  codereview-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - AI_MODEL=${AI_MODEL:-deepseek-reasoner}
      - SERVER_PORT=8080
    volumes:
      # Mount the repository to review
      - ${REPO_PATH:-.}:/repo:ro
    working_dir: /repo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/review/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
